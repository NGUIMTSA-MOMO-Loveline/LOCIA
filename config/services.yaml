# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# config/services.yaml
parameters:

services:
    # Configuration du PasswordHasher
    Symfony\Component\Security\Core\PasswordHasher\PasswordHasherInterface: '@security.password_hasher'

    # Définition d'un service avec des arguments injectés
    App\Controller\RegistrationController:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $passwordHasher: '@Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface'

    # Configuration par défaut pour l'autowiring et autoconfiguration
    _defaults:
        autowire: true      # Injection automatique des dépendances
        autoconfigure: true # Enregistre automatiquement les services comme commandes, événements, etc.

    # Déclaration des services pour les classes dans le répertoire 'src/'
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'


    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
# config/services.yaml

   
